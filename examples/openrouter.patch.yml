# For a dedicated web profile. Keep existing provider entries when merging.
# Jev chooses among all registered Harness models using their names and IDs.
- id: llm-pi-ai
  config:
    providers:
      openrouter:
        displayName: OpenRouter
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models:
          - id: !!js process.env.JEV_SMALL_MODEL
            name: !!js process.env.JEV_SMALL_MODEL
            maxTokens: 2048
          - id: !!js process.env.JEV_LARGE_MODEL
            name: !!js process.env.JEV_LARGE_MODEL
            maxTokens: 8192
- id: jev-router
  disabled: false
  config:
    apiKeyEnv: OPENROUTER_API_KEY
    historyMessages: 0

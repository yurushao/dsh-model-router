# Apply after installing the bundle. Candidate models come from Harness Settings → Models.
- id: jev-router
  disabled: false
  config:
    apiKeyEnv: OPENROUTER_API_KEY
    endpoint: https://openrouter.ai/api/alpha/decisions
    jevModel: typesafe/jev-1.13
    timeoutMs: 3000
    maxRoutingBytes: 16000
    historyMessages: 0
    includeSubagents: true
